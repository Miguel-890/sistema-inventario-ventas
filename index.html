<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStock POS & VENTA</title>
</head>

<body>
    <aside>
        <img src="assets/img/icons/logo.png" alt="logo-OmniStock">
        <h1 id="tituloPagina"><b>OmniStock</b></h1>

        <h2 class="menu-titulo">Modulos Clave</h2>
        <ul>
            <li class="modulos"><a href="index.html">Punto de Venta</a></li>
            <li class="modulos"><a href="inventario.html">Inventario & Stock</a></li>
            <li class="modulos"><a href="ventas.html">Ventas & Analitica</a></li>
            <li class="modulos"><a href="compras.html">Compras & Envio</a></li>
        </ul>
    </aside>

    <div class="contenido">
        <header>
            <input class="buscador" type="text" placeholder="Buscar producto, SKU">
        </header>

        <main>
            <section>
                <ul class="lista-categorias">
                    <li><button class="categoria-btn">Todos los Productos</button></li>
                    <li><button class="categoria-btn">Bebidas</button></li>
                    <li><button class="categoria-btn">Snacks & Abarrotes</button></li>
                    <li><button class="categoria-btn">Lacteos & Frescos</button></li>
                    <li><button class="categoria-btn">Limpieza</button></li>
                    <li><button class="categoria-btn">Teconologia</button></li>
                </ul>
            </section>

            <section class="grid-productos">
                <div class="producto-card">
                    <img src="assets/img/kombucha.jpg" alt="Kombucha">
                    <p>SKU-7721</p>
                    <h3>Kombucha Botanica</h3>

                    <div class="producto-precio">
                        <p>Precio Venta</p>
                        <p>$54.00</p>
                        <button>+</button>
                    </div>
                </div>

                <div class="producto-card">
                    <img src="assets/img/almendras.jpg" alt="Almendras">
                    <p>SKU-8910</p>
                    <h3>Almendras Tostadas Saladas</h3>

                    <div class="producto-precio">
                        <p>Precio Venta</p>
                        <p>$78.50</p>
                        <button>+</button>
                    </div>
                </div>

                <div class="producto-card">
                    <img src="assets/img/terraOlearia.jpg" alt="Aceite de Oliva">
                    <p>SKU-2041</p>
                    <h3>Aceite de Oliva</h3>

                    <div class="producto-precio">
                        <p>Precio Venta</p>
                        <p>$185.00</p>
                        <button>+</button>
                    </div>
                </div>
            </section>


        </main>
    </div>

</body>

</html>
